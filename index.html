<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cirrus Client</title>
    <meta name="description" content="軽量で美しいMinecraftクライアント" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="./assets/index-D68DxW0T.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Ci-Hecq0.css">
  </head>
  <body class="dark-theme">
    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-content">
        <div class="logo">
          <img src="./icons/banner.png" alt="Cirrus Logo" height="32" style="width: auto; max-height: 32px;" />
        </div>
        <div class="nav-links">
          <a href="#features" class="nav-item">特徴</a>
          <a href="/docs.html" class="nav-item">Docs</a>
          <a href="https://github.com/Cajuut/cirrus-mods" target="_blank" class="nav-item">GitHub</a>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
      <div class="hero-content fade-in-up">
        <div class="badge">Version 1.0 Alpha</div>
        <h1 class="hero-title">
          Beyond the Clouds.
        </h1>
        <p class="hero-subtitle">
          Tauriによる軽量・高パフォーマンスと、LiquidGlass採用の美しいUI。<br/>
          無駄を削ぎ落とした、あなたに最適なMinecraft体験を提供します。
        </p>
        <div class="hero-actions">
          <a href="#" class="btn btn-primary orbit-container">
            <span class="btn-text">Download for Windows</span>
            <div class="orbit-border"></div>
          </a>
          <a href="#features" class="btn btn-secondary">機能を見る</a>
        </div>
      </div>
      
      <!-- Mockup / Preview -->
      <div class="hero-mockup fade-in-up delay-1">
        <img src="./screenshot.png" alt="Launcher Preview" class="mockup-img" />
      </div>
    </header>

    <!-- Features Section -->
    <section id="features" class="features">
      <div class="section-header fade-in-up">
        <h2 class="section-title">Features & Modules</h2>
        <p class="section-subtitle">Search through 40+ built-in modules</p>
        <div class="search-container" style="margin-top: 2rem;">
          <input type="text" id="module-search" placeholder="Search modules... (e.g. FPS, PvP, Zoom)" class="search-input">
        </div>
      </div>

      <div class="feature-grid" id="module-grid">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-brand">
          <div class="logo">
            <img src="./icons/banner.png" alt="Cirrus Logo" height="24" style="width: auto; max-height: 24px;" />
          </div>
          <p class="copyright">&copy; 2026 Cirrus Team.</p>
        </div>
        <div class="footer-links">
          <a href="https://discord.com/invite/2WMkcXY3FM">Discord</a>
          <a href="https://github.com/Cajuut/cirrus-mods">GitHub</a>
        </div>
      </div>
    </footer>
